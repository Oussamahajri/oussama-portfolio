<div class="terminal-overlay" (click)="closeTerminal()">
  <div class="terminal-window" (click)="$event.stopPropagation(); focusInput()">
    <!-- Terminal Header Bar -->
    <div class="terminal-header">
      <div class="header-left">
        <span class="dot dot-red" (click)="closeTerminal()"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
        <span class="terminal-title">guest@hajri-identity: ~ (bash / zsh)</span>
      </div>
      <div class="header-right">
        <span class="badge-status">TTY-1 READY</span>
        <button class="close-btn" (click)="closeTerminal()" aria-label="Close terminal">✕</button>
      </div>
    </div>

    <!-- Terminal Output Stream -->
    <div class="terminal-body" (click)="focusInput()">
      @for (line of history(); track $index) {
        <div class="term-line" [class]="'line-' + line.type">
          {{ line.text }}
        </div>
      }
      <div #terminalEnd></div>

      <!-- Command Line Prompt Input -->
      <div class="term-prompt-row">
        <span class="prompt-symbol">guest&#64;hajri:~$</span>
        <input
          #cmdInput
          type="text"
          class="prompt-input"
          [value]="commandInput()"
          (input)="commandInput.set($any($event.target).value)"
          (keydown)="onKeyDown($event)"
          placeholder="Type command ('help', 'skills', 'matrix')..."
          autocomplete="off"
          spellcheck="false"
          autofocus />
      </div>
    </div>
  </div>
</div>
